# TLS-terminating nginx config. Enable with:
#   ./scripts/gen-dev-certs.sh
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# Bearer tokens travel in the Authorization header and the Socket.IO auth
# payload, so the whole site must be HTTPS/WSS to keep them off the wire.

# Only send "Connection: upgrade" for requests that actually ask to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # No plaintext traffic reaches the app.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Keep browsers on HTTPS once they have seen this header.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets the app enforce CHAT_REQUIRE_HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the Socket.IO transport.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
